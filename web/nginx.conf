server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 8g;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Laravel API + public image routes + health check
    location ~ ^/(api|i|up|f|d)(/|$) {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
        fastcgi_read_timeout 3600s;
        fastcgi_request_buffering off;
    }

    # Reverb WebSocket (pusher-протокол): /app/<key>?protocol=7.
    # В проде /app перехватывает Traefik → reverb; здесь — для
    # локального стека, где web открыт напрямую.
    location /app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
