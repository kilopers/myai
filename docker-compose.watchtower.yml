name: screenshoter-watchtower

# Watchtower — отдельный стек, чтобы не убивался `docker compose down`
# основного проекта. Режим HTTP API: мгновенный триггер обновления через
# POST /v1/update (Bearer WATCHTOWER_TOKEN) — его дёргает deploy.yml
# в GitHub Actions после пуша образов; polling каждые 3 мин остаётся
# страховкой.
#
# Запуск: docker compose -f docker-compose.watchtower.yml up -d
# Триггер: curl -X POST -H "Authorization: Bearer $WATCHTOWER_TOKEN" \
#            http://localhost:8283/v1/update

services:
  watchtower:
    image: nickfedor/watchtower
    container_name: screenshoter-watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_POLL_INTERVAL: 180
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCOPE: screenshoter
      WATCHTOWER_HTTP_API_MODE: "true"
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_TOKEN:?Set WATCHTOWER_TOKEN in .env}
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "true"
    ports:
      - "${WATCHTOWER_PORT:-8283}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # auth для приватного GHCR — после docker login ghcr.io на сервере
      - ${DOCKER_CONFIG:-~/.docker}/config.json:/config.json:ro
