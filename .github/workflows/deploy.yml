name: Deploy

# Автодеплой: push в main → образы в GHCR → Watchtower на сервере
# подтягивает их и пересоздаёт контейнеры (миграции — в entrypoint app).
# Образы: ghcr.io/kilopers/myai/server и .../web (теги latest и sha).
# Имена вложенные (myai/server) — пакет создаётся GITHUB_TOKEN'ом
# и автоматически привязывается к репозиторию; плоские имена
# myai-server/-web в GHCR уже заняты «сиротами» без привязки.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Базовый образ (ffmpeg/poppler/LibreOffice): пакет
      # myai/server-base в GHCR не прилинкован к репо — GITHUB_TOKEN
      # его не тянет. Поэтому база пушится тегом в ПРИЛИНКОВАННЫЙ
      # пакет myai/server (base-<версия Dockerfile.base>), а сборка
      # server получает её через build-arg BASE_IMAGE.
      - name: Build & push server base (ffmpeg/poppler/LibreOffice)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile.base
          push: true
          tags: ghcr.io/kilopers/myai/server:base-1.0
          cache-from: type=gha,scope=server-base
          cache-to: type=gha,mode=max,scope=server-base

      - name: Build & push server (app/queue)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/kilopers/myai/server:latest
            ghcr.io/kilopers/myai/server:${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/kilopers/myai/server:base-1.0
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build & push web (nginx)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ghcr.io/kilopers/myai/web:latest
            ghcr.io/kilopers/myai/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Мгновенный триггер автодеплоя: дёргаем HTTP API Watchtower на
      # сервере (polling остаётся страховкой). Секрет: WATCHTOWER_TOKEN.
      - name: Trigger watchtower
        if: success()
        continue-on-error: true
        run: |
          curl -sS -X POST https://myai.ai.kilop.ru/_watchtower/v1/update \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            --max-time 30
