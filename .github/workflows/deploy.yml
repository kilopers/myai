name: Deploy

# Автодеплой: push в main → образы в GHCR → Watchtower на сервере
# подтягивает их и пересоздаёт контейнеры (миграции — в entrypoint app).
# Образы: ghcr.io/kilopers/screenshoter/server и .../web (теги latest и sha).
# Имена вложенные (screenshoter/server) — пакет создаётся GITHUB_TOKEN'ом
# и автоматически привязывается к репозиторию; плоские имена
# screenshoter-server/-web в GHCR уже заняты «сиротами» без привязки.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push server (app/queue)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/kilopers/screenshoter/server:latest
            ghcr.io/kilopers/screenshoter/server:${{ github.sha }}

      - name: Build & push web (nginx)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ghcr.io/kilopers/screenshoter/web:latest
            ghcr.io/kilopers/screenshoter/web:${{ github.sha }}

      # Мгновенный триггер автодеплоя: дёргаем HTTP API Watchtower на
      # сервере (polling остаётся страховкой). Секрет: WATCHTOWER_TOKEN.
      - name: Trigger watchtower
        if: success()
        continue-on-error: true
        run: |
          curl -sS -X POST https://watchtower.ai.kilop.ru/v1/update \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            --max-time 30

      - name: Deploy status
        if: always()
        run: |
          curl -sS -X POST https://build.kilop.ru/api/deploy/status \
            -H 'Content-Type: application/json' \
            -d "{\"project\":\"screenshoter\",\"status\":\"$([ \"${{ job.status }}\" = success ] && echo success || echo failed)\",\"data\":\"images ghcr.io/kilopers/screenshoter/{server,web}:${{ github.sha }}\"}"
