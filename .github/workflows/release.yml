name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          shared-key: ${{ matrix.platform }}

      - name: Build & upload release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Screenshoter ${{ github.ref_name }}'
          releaseBody: |
            Windows: запустите .msi или .exe инсталлятор.
            macOS (Apple Silicon): скачайте .dmg, перетащите в Applications. Если macOS пишет «Приложение повреждено» — это карантин Gatekeeper для неподписанного приложения. Снимите карантин: `xattr -cr /Applications/Screenshoter.app` в Терминале.
          releaseDraft: true
          prerelease: false
          # macOS собираем только под arm64 (Apple Silicon) — universal
          # компилирует два бинарника и вдвое дольше.
          args: ''
