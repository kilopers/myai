<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screenshoter</title>
    <style>
      html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; height: 100%; }
      #canvas { display: block; cursor: crosshair; }
      #toolbar {
        position: fixed; display: none; gap: 6px; padding: 6px 8px;
        background: #1e1e24; border-radius: 8px; z-index: 10;
        box-shadow: 0 4px 16px rgba(0,0,0,.5);
      }
      #toolbar button {
        background: #2c2c34; color: #eee; border: 1px solid #444;
        border-radius: 6px; padding: 6px 10px; font: 13px system-ui; cursor: pointer;
      }
      #toolbar button:hover { background: #3a3a46; }
      #toolbar button.active { background: #4a6cf7; border-color: #4a6cf7; }
      #toolbar button.primary { background: #2f9e44; border-color: #2f9e44; }
      #toolbar button.primary:hover { background: #37b24d; }
      #toolbar button.danger { background: #7a3131; border-color: #7a3131; }
      #dim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 5; display: none; }

      /* Settings view */
      #settings-view {
        display: none; height: 100vh; box-sizing: border-box; padding: 24px;
        background: #16161c; color: #eee; font: 14px system-ui;
      }
      #settings-view h1 { font-size: 18px; margin: 0 0 16px; }
      #settings-view label { display: block; margin: 12px 0 4px; color: #aaa; }
      #settings-view input {
        width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 6px;
        border: 1px solid #444; background: #22222a; color: #eee;
      }
      #settings-view button {
        margin-top: 16px; padding: 8px 18px; border-radius: 6px; border: none;
        background: #4a6cf7; color: #fff; cursor: pointer;
      }
      #settings-view .hint { color: #777; font-size: 12px; margin-top: 14px; }
      #settings-status { color: #7bd88a; font-size: 12px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div id="toolbar"></div>
    <canvas id="canvas"></canvas>
    <div id="settings-view">
      <h1>Screenshoter — настройки</h1>
      <label>Адрес сервера</label>
      <input id="server-url" placeholder="https://shots.example.com" />
      <label>API-токен</label>
      <input id="api-token" placeholder="1|abcdef..." />
      <label style="display:flex;align-items:center;gap:8px;text-transform:none;cursor:pointer">
        <input type="checkbox" id="autostart" style="width:auto" />
        Запускать при старте системы
      </label>
      <button id="save-settings">Сохранить</button>
      <div id="settings-status"></div>
      <div class="hint">
        Хоткей: Ctrl+Shift+X (Win) / Ctrl+Shift+X (Mac) — выделение области.<br />
        Токен создаётся в веб-интерфейсе: Настройки → API-токены.
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
