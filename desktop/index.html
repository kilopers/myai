<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screenshoter</title>
    <style>
      html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; height: 100%; }
      #canvas { display: block; cursor: crosshair; }

      /* Панель редактора — Material-стиль */
      #toolbar {
        position: fixed; top: 0; left: 0; right: 0; z-index: 10;
        display: none; align-items: center; gap: 2px; padding: 6px 10px;
        background: #ffffff; border-bottom: 1px solid #e0e0e0;
        box-shadow: 0 1px 3px rgba(0,0,0,.15);
        font-family: Roboto, system-ui, sans-serif;
      }
      #toolbar button {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        min-width: 40px; height: 40px; padding: 0 8px;
        border: none; border-radius: 8px;
        background: transparent; color: #5f6368; cursor: pointer;
        font: 500 13px Roboto, system-ui, sans-serif;
        transition: background .15s ease;
      }
      #toolbar button:hover { background: rgba(0,0,0,.06); }
      #toolbar button.active { background: #e8f0fe; color: #1a73e8; }
      #toolbar button.primary {
        background: #1a73e8; color: #fff; height: 36px;
        padding: 0 16px; margin-left: 6px;
      }
      #toolbar button.primary:hover { background: #1765cc; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
      #toolbar svg { width: 20px; height: 20px; fill: currentColor; }
      #toolbar .sep { width: 1px; height: 24px; background: #dadce0; margin: 0 6px; }
      #toolbar .spacer { flex: 1; }
      #toolbar .hint-text { color: #80868b; font-size: 12px; margin-right: 8px; }
      #toolbar button.swatch {
        min-width: 0; width: 26px; height: 26px; padding: 0;
        border-radius: 50%; border: 2px solid rgba(0,0,0,.15); margin: 0 3px;
      }
      #toolbar button.swatch:hover { transform: scale(1.1); background: inherit; }
      #toolbar button.swatch.active { border-color: #1a73e8; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #1a73e8; }
      #text-input {
        position: fixed; z-index: 30; padding: 6px 10px;
        font: 16px system-ui; border: 2px solid #1a73e8; border-radius: 8px;
        background: #fff; color: #222; outline: none;
        box-shadow: 0 2px 8px rgba(0,0,0,.25);
      }

      /* Settings view */
      #settings-view {
        display: none; height: 100vh; box-sizing: border-box; padding: 24px;
        background: #16161c; color: #eee; font: 14px system-ui;
      }
      #settings-view h1 { font-size: 18px; margin: 0 0 16px; }
      #settings-view label { display: block; margin: 12px 0 4px; color: #aaa; }
      #settings-view input {
        width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 6px;
        border: 1px solid #444; background: #22222a; color: #eee;
      }
      #settings-view button {
        margin-top: 16px; padding: 8px 18px; border-radius: 6px; border: none;
        background: #4a6cf7; color: #fff; cursor: pointer;
      }
      #settings-view .hint { color: #777; font-size: 12px; margin-top: 14px; }
      #settings-view .row { display: flex; gap: 6px; }
      #settings-view .row input { flex: 1; }
      #settings-view .row button { margin-top: 0; white-space: nowrap; }
      #settings-view button.secondary { background: #33333c; }
      #settings-view a { color: #7aa2ff; }
      #sync-log {
        width: 100%; box-sizing: border-box; height: 170px; resize: none;
        margin-top: 4px; padding: 8px; border-radius: 6px;
        border: 1px solid #444; background: #101014; color: #9fd0a0;
        font: 11px/1.45 ui-monospace, Menlo, Consolas, monospace;
        overflow-y: auto; white-space: pre-wrap;
      }
      #settings-status { color: #7bd88a; font-size: 12px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div id="toolbar" data-tauri-drag-region></div>
    <canvas id="canvas"></canvas>
    <div id="settings-view">
      <h1>Screenshoter — настройки</h1>
      <label>Адрес сервера</label>
      <input id="server-url" placeholder="https://shots.example.com" />
      <label>API-токен</label>
      <input id="api-token" placeholder="1|abcdef..." />
      <label style="display:flex;align-items:center;gap:8px;text-transform:none;cursor:pointer">
        <input type="checkbox" id="autostart" style="width:auto" />
        Запускать при старте системы
      </label>

      <label>Папка синхронизации</label>
      <div class="row">
        <input id="sync-folder" placeholder="Не выбрана" readonly />
        <button id="pick-folder" class="secondary" type="button">Выбрать…</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="sync-now" class="secondary" type="button">Синхронизировать сейчас</button>
      </div>
      <div class="hint" id="macos-perms" style="display:none">
        macOS: для захвата экрана и доступа к папке нужны разрешения —
        <a href="#" id="open-privacy">открыть «Конфиденциальность и безопасность»</a>
      </div>

      <button id="save-settings">Сохранить</button>
      <div id="settings-status"></div>

      <div class="hint" id="sync-hash" style="margin-top:8px"></div>

      <label>Журнал синхронизации</label>
      <textarea id="sync-log" readonly></textarea>

      <div class="hint">
        Хоткей: Ctrl+Shift+X — выделение области.<br />
        Токен создаётся в веб-интерфейсе: Настройки → API-токены.
      </div>
    </div>
    <div id="about-view" style="display:none; text-align:center; padding-top:56px">
      <h1 style="font-size:20px;margin:0 0 8px">Screenshoter</h1>
      <div class="hint" id="about-version" style="color:#aaa;font-size:13px"></div>
      <div class="hint" style="color:#777;font-size:12px;margin-top:16px">
        Скриншоты по Ctrl+Shift+X
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
