name: myai

# Автодеплой: GitHub Actions (deploy.yml) собирает образы в GHCR при пуше
# в main, Watchtower на сервере подтягивает их и пересоздаёт контейнеры.
# Прод на хосте: docker compose pull && docker compose up -d
# Локальная сборка без registry: docker compose up --build (build: оставлен).

x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
  APP_URL: ${APP_URL:-http://localhost:8080}
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-myai}
  DB_USERNAME: ${DB_USERNAME:-myai}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  FILESYSTEM_DISK: public
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@myai.local}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
  SEED_ADMIN: "true"
  BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}
  REVERB_APP_ID: ${REVERB_APP_ID:-myai}
  REVERB_APP_KEY: ${REVERB_APP_KEY:-local-key}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:-local-secret}
  REVERB_HOST: ${REVERB_HOST:-reverb}
  REVERB_PORT: ${REVERB_PORT:-8080}
  REVERB_SCHEME: ${REVERB_SCHEME:-http}
  RELEASE_SYNC_TOKEN: ${RELEASE_SYNC_TOKEN:-}
  # Торрент-движок aria2 (сервис ниже): JSON-RPC внутри docker-сети.
  TORRENT_RPC_URL: ${TORRENT_RPC_URL:-http://aria2:6800/jsonrpc}
  TORRENT_RPC_SECRET: ${TORRENT_RPC_SECRET:-myai-torrent}
  TORRENT_DOWNLOAD_DIR: /downloads

x-app-volumes: &app-volumes
  - ./data/screenshots:/var/www/html/storage/app/public
  # staging торрент-загрузок — тот же каталог, что /downloads у aria2
  - ./data/torrents:/var/www/html/storage/app/torrents

# Метка скоупа Watchtower — автообновляются только контейнеры этого проекта
x-watchtower-label: &watchtower-label
  com.centurylinklabs.watchtower.scope: myai

services:
  app:
    image: ${SERVER_IMAGE:-ghcr.io/kilopers/myai/server}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: server/Dockerfile
    environment: *app-env
    labels: *watchtower-label
    volumes: *app-volumes
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  queue:
    image: ${SERVER_IMAGE:-ghcr.io/kilopers/myai/server}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: server/Dockerfile
    command: >
      sh -c "php artisan schedule:work --no-interaction &
             exec php artisan queue:work --tries=3 --sleep=3"
    entrypoint: []
    user: www-data
    environment: *app-env
    labels: *watchtower-label
    volumes: *app-volumes
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  reverb:
    image: ${SERVER_IMAGE:-ghcr.io/kilopers/myai/server}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: server/Dockerfile
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    entrypoint: []
    environment:
      <<: *app-env
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-myai}
      REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Set REVERB_APP_SECRET in .env}
      REVERB_HOST: ${REVERB_PUBLIC_HOST:-localhost}
      REVERB_PORT: ${REVERB_PUBLIC_PORT:-8080}
      REVERB_SCHEME: ${REVERB_PUBLIC_SCHEME:-http}
    labels: *watchtower-label
    ports:
      - "${WS_PORT:-8286}:8080"
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  # Торрент-движок aria2: JSON-RPC-демон, только скачивание (без
  # раздачи). RPC-порт наружу не публикуется — доступ только из
  # docker-сети; BT-порты 6881 нужны для пиров (могут быть заняты —
  # переопределяются BT_LISTEN_PORT в .env).
  aria2:
    image: ${ARIA2_IMAGE:-ghcr.io/kilopers/myai/aria2}:${IMAGE_TAG:-latest}
    build:
      context: ./aria2
    # uid/gid 82 = www-data в php-alpine образе app: staging-файлы
    # aria2 должны быть перезаписываемыми из контейнеров app/queue
    # (перенос результата, очистка staging). Права на ./data/torrents
    # выставляет entrypoint app (chown -R www-data storage).
    user: "82:82"
    command: >
      --enable-rpc=true
      --rpc-listen-all=true
      --rpc-listen-port=6800
      --rpc-secret=${TORRENT_RPC_SECRET:-myai-torrent}
      --dir=/downloads
      --listen-port=6881
      --dht-listen-port=6881
      --seed-time=0
      --seed-ratio=0.0
      --bt-stop-timeout=60
      --max-connection-per-server=16
      --file-allocation=none
      --summary-interval=0
      --save-session=/downloads/.aria2.session
      --save-session-interval=30
    labels: *watchtower-label
    ports:
      - "${BT_LISTEN_PORT:-6881}:6881"
      - "${BT_LISTEN_PORT:-6881}:6881/udp"
    volumes:
      - ./data/torrents:/downloads
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-myai}
      MYSQL_USER: ${DB_USERNAME:-myai}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - ./data/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-ghcr.io/kilopers/myai/web}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: web/Dockerfile
    labels: *watchtower-label
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - app
    restart: unless-stopped

  # Watchtower: polling GHCR (3 мин, страховка) + HTTP API /v1/update
  # (Bearer WATCHTOWER_TOKEN). Снаружи — https://<домен>/_watchtower
  # (роутер в Traefik, PathPrefix + stripPrefix), триггер из deploy.yml.
  watchtower:
    image: nickfedor/watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_POLL_INTERVAL: 180
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCOPE: myai
      WATCHTOWER_HTTP_API_MODE: "true"
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_TOKEN:?Set WATCHTOWER_TOKEN in .env}
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "true"
    ports:
      - "${WATCHTOWER_PORT:-8283}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # auth для приватного GHCR — после docker login ghcr.io на сервере
      - ${DOCKER_CONFIG:-~/.docker}/config.json:/config.json:ro
