name: screenshoter

# Автодеплой: GitHub Actions (deploy.yml) собирает образы в GHCR при пуше
# в main, Watchtower на сервере подтягивает их и пересоздаёт контейнеры.
# Прод на хосте: docker compose pull && docker compose up -d
# Локальная сборка без registry: docker compose up --build (build: оставлен).

x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
  APP_URL: ${APP_URL:-http://localhost:8080}
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-screenshoter}
  DB_USERNAME: ${DB_USERNAME:-screenshoter}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  FILESYSTEM_DISK: public
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@screenshoter.local}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
  SEED_ADMIN: "true"

x-app-volumes: &app-volumes
  - ./data/screenshots:/var/www/html/storage/app/public

# Метка скоупа Watchtower — автообновляются только контейнеры этого проекта
x-watchtower-label: &watchtower-label
  com.centurylinklabs.watchtower.scope: screenshoter

services:
  app:
    image: ${SERVER_IMAGE:-ghcr.io/kilopers/screenshoter-server}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: server/Dockerfile
    environment: *app-env
    labels: *watchtower-label
    volumes: *app-volumes
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  queue:
    image: ${SERVER_IMAGE:-ghcr.io/kilopers/screenshoter-server}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: server/Dockerfile
    command: php artisan queue:work --tries=3 --sleep=3
    entrypoint: []
    user: www-data
    environment: *app-env
    labels: *watchtower-label
    volumes: *app-volumes
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-screenshoter}
      MYSQL_USER: ${DB_USERNAME:-screenshoter}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - ./data/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-ghcr.io/kilopers/screenshoter-web}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: web/Dockerfile
    labels: *watchtower-label
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - app
    restart: unless-stopped

  # Наблюдатель за обновлениями: каждые 3 минуты проверяет GHCR,
  # при новом образе — pull и пересоздание контейнеров скоупа screenshoter
  watchtower:
    image: nickfedor/watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_POLL_INTERVAL: 180
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCOPE: screenshoter
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # auth для приватного GHCR — после docker login ghcr.io на сервере
      - ${DOCKER_CONFIG:-~/.docker}/config.json:/config.json:ro
