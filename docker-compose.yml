name: screenshoter

x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
  APP_URL: ${APP_URL:-http://localhost:8080}
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-screenshoter}
  DB_USERNAME: ${DB_USERNAME:-screenshoter}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  FILESYSTEM_DISK: public
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@screenshoter.local}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
  SEED_ADMIN: "true"

x-app-volumes: &app-volumes
  - ./data/screenshots:/var/www/html/storage/app/public

services:
  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: php artisan queue:work --tries=3 --sleep=3
    entrypoint: []
    user: www-data
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-screenshoter}
      MYSQL_USER: ${DB_USERNAME:-screenshoter}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - ./data/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - app
    restart: unless-stopped
